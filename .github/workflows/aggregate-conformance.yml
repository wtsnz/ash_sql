name: Aggregate conformance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aggregates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: conformance
    env:
      MIX_ENV: test
      CONFORMANCE_ADAPTERS: ${{ matrix.adapter }}
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.4.3'
          elixir-version: '1.18.4'
      - uses: actions/cache@v4
        with:
          path: |
            conformance/deps
            conformance/_build
          key: conformance-${{ runner.os }}-otp27-elixir1.18-${{ hashFiles('conformance/mix.lock') }}
      - run: mix deps.get --check-locked
      - run: mix check
      - run: mix dialyzer
        if: matrix.adapter == 'postgres'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aggregate-contracts-${{ matrix.adapter }}
          path: conformance/results/
